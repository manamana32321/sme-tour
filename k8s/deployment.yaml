apiVersion: apps/v1
kind: Deployment
metadata:
  name: sme-tour-engine
  namespace: sme-tour
  labels:
    app: sme-tour-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sme-tour-engine
  template:
    metadata:
      labels:
        app: sme-tour-engine
    spec:
      # 이미지가 amd64 단일 아키(engine-build.yml에 platforms 미지정)이고,
      # Gurobi도 arm64 미지원 — arm64 노드(raspi-1)에 스케줄되면 ImagePullBackOff.
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: engine
          image: ghcr.io/manamana32321/sme-tour-engine:latest
          ports:
            - containerPort: 8000
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: "https://sme-tour.json-server.win,http://localhost:3000"
            - name: CORS_ALLOWED_ORIGIN_REGEX
              value: "https://sme-tour-.*\\.vercel\\.app"
          envFrom:
            # Gurobi WLS 자격증명 (GUROBI_LICENSE_ID / GUROBI_WLS_ACCESS_ID / GUROBI_WLS_SECRET)
            # SealedSecret: k8s/gurobi-credentials/sealed-secret.yaml
            - secretRef:
                name: sme-tour-gurobi-wls
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
